<!doctype html>
<html>
  <head>
    <meta name="color-scheme" content="light dark" />
    <script type="module">
      import VLC, { VLC_READY_VALUE } from "./src/lib/VLC";
      window.VLC = VLC;
      window.onmessage = (event) => {
        if (event.data.action === "vlc-stylesheet") {
          const link = document.createElement("link");
          link.href = event.data.payload;
          link.type = "text/css";
          link.rel = "stylesheet";
          document.head.appendChild;
        }
      };
      window.postMessage(VLC_READY_VALUE);
    </script>
    <style>
      html,
      body {
        padding: 0px;
        margin: 0px;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <canvas id="vlc-output" width="1280" height="720"></canvas>
  </body>
</html>
